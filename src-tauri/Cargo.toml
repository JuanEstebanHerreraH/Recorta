# App de escritorio de Recorta (Tauri 2).
# La interfaz es la misma app web (carpeta dist/); Rust solo abre la ventana.
[package]
name = "recorta"
version = "1.0.0"
description = "Recorta: quita fondos y exporta PNG con el tamaño, DPI y peso correctos"
authors = ["Recorta"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# El sufijo _lib evita un choque de nombres con el ejecutable en Windows.
name = "recorta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Ejecutable final más chico (tarda un poco más en compilar).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
